[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "platonic-task-arithmetic"
version = "1.0.0"
description = "Platonic Task Arithmetic (NeurIPS 2026): task arithmetic across pre-trained models of different families"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers==4.49.0",
    "peft==0.14.0",
    "open_clip_torch==3.3.0",
    "timm>=1.0",
    "datasets>=3.0",
    "pyarrow>=15",
    "numpy<2",
    "pillow",
    "scipy",
]

[project.urls]
Repository = "https://github.com/jhpark-ai/Platonic-Task-Arithmetic"

[tool.setuptools.packages.find]
include = ["pta*"]

[tool.setuptools.package-data]
pta = ["data/*.txt"]
